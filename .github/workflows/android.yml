name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app (frontend only)
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core
          npm install --legacy-peer-deps @capacitor/cli
          npm install --legacy-peer-deps @capacitor/android

      - name: Init Capacitor
        run: npx cap init "SAFI" com.safi.app --web-dir dist

      - name: Add Android platform
        run: npx cap sync android

      - name: Add Internet permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Force single Kotlin stdlib version
        run: |
          cat <<'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.8.22'
                  }
              }
          }
          EOF

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: football-ia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
